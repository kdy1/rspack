name: Gungraun

on:
  workflow_dispatch:
    inputs:
      base_ref:
        description: 'Exact base commit SHA in kdy1/rspack'
        required: true
        type: string
      head_ref:
        description: 'Exact head commit SHA in kdy1/rspack'
        required: true
        type: string
      filter:
        description: 'Case name substring (native Gungraun filter for legacy sources)'
        default: ''
        type: string
      suite:
        description: 'Rust benchmark suite (sources is the original isolated smoke suite)'
        type: choice
        default: all
        options:
          - all
          - benches
          - rspack_sources
          - walltime
          - sources
  pull_request:
    paths:
      - '.github/workflows/gungraun.yml'
      - '.github/scripts/gungraun.py'
      - '.github/scripts/test_gungraun.py'
      - 'xtask/gungraun/**'
      - 'xtask/benchmark/**'

permissions:
  contents: read

concurrency:
  group: gungraun-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  compare:
    # Fork-owned infrastructure; PR runs validate the harness with identical SHAs.
    if: github.repository == 'kdy1/rspack' && (github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == 'kdy1/rspack')
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      CARGO_INCREMENTAL: '0'
      CARGO_BUILD_JOBS: '2'
      GLIBC_TUNABLES: glibc.cpu.hwcaps=-AVX512F,-AVX2,-AVX,-AVX_Fast_Unaligned_Load,-ERMS,-Prefer_ERMS,-SSE4_2,-SSSE3
      GUNGRAUN_SUITE: ${{ inputs.suite || 'sources' }}
      GUNGRAUN_FIXTURE_SHA: a24cc8316e37328c13c153cfc896210b0ccf46a9
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: kdy1/rspack
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Check comparison parser
        run: python3 -m unittest discover -s .github/scripts -p test_gungraun.py
      - name: Set up Node.js for benchmark fixtures
        if: env.GUNGRAUN_SUITE != 'sources'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22'
      - name: Set up pnpm for benchmark fixtures
        if: env.GUNGRAUN_SUITE != 'sources'
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        env:
          PNPM_CONFIG_REGISTRY: https://registry.npmjs.org
      - name: Prepare pinned benchmark fixtures
        if: env.GUNGRAUN_SUITE != 'sources'
        run: |
          git init .bench/rspack-benchcases
          git -C .bench/rspack-benchcases remote add origin https://github.com/rstackjs/rspack-benchcases.git
          git -C .bench/rspack-benchcases fetch --depth=1 origin "$GUNGRAUN_FIXTURE_SHA"
          git -C .bench/rspack-benchcases checkout --detach FETCH_HEAD
          (cd .bench/rspack-benchcases && pnpm install --frozen-lockfile --ignore-scripts)
          node scripts/bench/setup.mjs
          echo "RSPACK_BENCHCASES_DIR=$GITHUB_WORKSPACE/.bench/rspack-benchcases" >> "$GITHUB_ENV"
      - name: Install Rust
        run: |
          toolchain=$(python3 -c 'import tomllib; print(tomllib.load(open("rust-toolchain.toml", "rb"))["toolchain"]["channel"])')
          rustup toolchain install "$toolchain" --profile minimal
      - name: Install Valgrind and matching Gungraun runner
        run: |
          sudo apt-get update
          sudo apt-get install --yes valgrind libclang-dev
          cargo install --locked gungraun-runner --version 0.20.0
      - name: Free space for the full Rust benchmark build
        if: env.GUNGRAUN_SUITE != 'sources'
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          df -h
      - name: Compare revisions
        env:
          BASE_SHA: ${{ inputs.base_ref || github.event.pull_request.head.sha }}
          HEAD_SHA: ${{ inputs.head_ref || github.event.pull_request.head.sha }}
          BENCH_FILTER: ${{ inputs.filter }}
        run: |
          python3 .github/scripts/gungraun.py \
            --base "$BASE_SHA" --head "$HEAD_SHA" --filter "$BENCH_FILTER" \
            --suite "$GUNGRAUN_SUITE" \
            --output "$RUNNER_TEMP/gungraun-results"
      - name: Upload summaries and raw profiles
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: gungraun-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/gungraun-results
          if-no-files-found: warn
          retention-days: 30
